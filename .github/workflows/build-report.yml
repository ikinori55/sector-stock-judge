name: Build sector dashboard

# 手動実行 (Actions画面 or GitHubアプリの "Run workflow") + 平日の定期実行。
# iPhoneのClaudeは公開された最新JSONを読むだけなので、定期実行で自動更新される。
# 自動更新を止めたいときは下の schedule をコメントアウトする。
on:
  workflow_dispatch:
  schedule:
    - cron: "30 7 * * 1-5"   # 平日 07:30 UTC (=日本 16:30) に自動更新

# gh-pages ブランチへ直接 push して配信する（新規リポジトリでも安定）。
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate reports
        # 日本株は JQUANTS_API_KEY があれば J-Quants(TOPIX-17指数)、無ければ yfinance にフォールバック。
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
        run: |
          python scripts/sector_data.py --market both
          python scripts/sector_report.py
          python scripts/sector_trend.py --market both
          python scripts/sector_history.py --market both || echo "history skipped"
          python scripts/sector_history_report.py || echo "history report skipped"
          python scripts/build_site.py

      - name: Publish to gh-pages branch
        # site/ の中身を gh-pages ブランチにそのまま公開。.nojekyll で Jekyll 処理を無効化。
        run: |
          touch site/.nojekyll
          cd site
          git init -q
          git checkout -q -b gh-pages
          git -c user.name='github-actions[bot]' \
              -c user.email='github-actions[bot]@users.noreply.github.com' \
              add -A
          git -c user.name='github-actions[bot]' \
              -c user.email='github-actions[bot]@users.noreply.github.com' \
              commit -q -m "Deploy $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
